<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>단추 배식 관리</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="단추밥" />
  <meta name="theme-color" content="#e07b39" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background: #fdf6ee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
      position: relative;
      width: 100%;
      max-width: 420px;
    }

    .settings-btn {
      position: absolute;
      top: 0;
      right: 0;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
    }

    .dog-emoji { font-size: 64px; line-height: 1; margin-bottom: 8px; }

    header h1 {
      font-size: 26px;
      font-weight: 800;
      color: #3d2b1f;
    }

    header p {
      font-size: 13px;
      color: #a0856a;
      margin-top: 4px;
    }

    .date-bar {
      background: #fff;
      border: 1.5px solid #e8d5c0;
      border-radius: 12px;
      padding: 10px 20px;
      font-size: 13px;
      color: #7a5c3e;
      margin-bottom: 24px;
      text-align: center;
      width: 100%;
      max-width: 420px;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: #fff;
      border: 2px solid #e8d5c0;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .card-icon { font-size: 32px; }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: #3d2b1f;
    }

    .card-subtitle {
      font-size: 12px;
      color: #a0856a;
      margin-top: 2px;
    }

    .status-badge {
      margin-left: auto;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .status-badge.ok  { background: #fff0e0; color: #d4733a; }
    .status-badge.done { background: #e6f4ea; color: #2e7d32; }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
      min-height: 40px;
    }

    .log-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fdf6ee;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 14px;
    }

    .log-item .who { font-weight: 700; color: #3d2b1f; }

    .log-item .when {
      font-size: 12px;
      color: #a0856a;
      cursor: pointer;
      text-decoration: underline dotted;
      padding: 2px 4px;
      border-radius: 4px;
    }

    .log-item .when:hover { background: #f0e4d4; }

    .log-item .time-input {
      font-size: 12px;
      color: #3d2b1f;
      border: 1.5px solid #e07b39;
      border-radius: 6px;
      padding: 2px 4px;
      background: #fff;
      width: 80px;
    }

    .log-item .delete-btn {
      background: none;
      border: none;
      color: #c9a07a;
      cursor: pointer;
      font-size: 16px;
      padding: 0 0 0 8px;
      line-height: 1;
    }

    .log-item .delete-btn:hover { color: #c0392b; }

    .empty-msg {
      color: #c9a07a;
      font-size: 13px;
      text-align: center;
      padding: 8px 0;
    }

    .member-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .member-btn {
      padding: 10px 0;
      border-radius: 12px;
      border: 2px solid transparent;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      color: #fff;
    }

    .member-btn:active { transform: scale(.96); }
    .member-btn:disabled { opacity: .4; cursor: not-allowed; }

    .reset-section, .qr-section {
      width: 100%;
      max-width: 420px;
      margin-top: 16px;
    }

    .reset-btn, .qr-toggle-btn {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: 2px solid #e8d5c0;
      background: #fff;
      color: #a0856a;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
    }

    .reset-btn:hover, .qr-toggle-btn:hover { background: #fdf0e4; }

    .qr-box {
      display: none;
      background: #fff;
      border: 1.5px solid #e8d5c0;
      border-radius: 16px;
      padding: 20px;
      margin-top: 12px;
      text-align: center;
    }

    .qr-box.open { display: block; }
    .qr-box p { font-size: 13px; color: #7a5c3e; margin-bottom: 14px; }
    #qrcode { display: inline-block; }

    .history-section {
      width: 100%;
      max-width: 420px;
      margin-top: 24px;
    }

    .history-title {
      font-size: 14px;
      font-weight: 700;
      color: #7a5c3e;
      margin-bottom: 10px;
      padding-left: 4px;
    }

    .history-table {
      background: #fff;
      border: 1.5px solid #e8d5c0;
      border-radius: 14px;
      overflow: hidden;
      font-size: 13px;
    }

    .history-table table { width: 100%; border-collapse: collapse; }

    .history-table th {
      background: #fdf0e4;
      color: #7a5c3e;
      font-weight: 700;
      padding: 10px 14px;
      text-align: left;
    }

    .history-table td {
      padding: 9px 14px;
      border-top: 1px solid #f0e4d4;
      color: #3d2b1f;
    }

    .history-table tr:last-child td { border-bottom: none; }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .tag.food  { background: #fff0e0; color: #d4733a; }
    .tag.water { background: #e0f0ff; color: #2176ae; }

    /* ── 가족 관리 모달 ── */
    .settings-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }

    .settings-overlay.open { display: flex; }

    .settings-panel {
      background: #fff;
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 480px;
      padding: 16px 20px 40px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .settings-handle {
      width: 40px;
      height: 4px;
      background: #e8d5c0;
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    .settings-title {
      font-size: 18px;
      font-weight: 800;
      color: #3d2b1f;
      margin-bottom: 16px;
    }

    .member-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #f0e4d4;
    }

    .member-color-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .member-name-input {
      flex: 1;
      font-size: 15px;
      font-weight: 700;
      color: #3d2b1f;
      border: 1.5px solid #e8d5c0;
      border-radius: 8px;
      padding: 7px 10px;
      background: #fdf6ee;
    }

    .member-name-input:focus {
      outline: none;
      border-color: #e07b39;
      background: #fff;
    }

    .member-del-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
      color: #c9a07a;
      flex-shrink: 0;
    }

    .member-del-btn:hover { color: #c0392b; }

    .add-member-row {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .add-member-input {
      flex: 1;
      font-size: 14px;
      border: 1.5px solid #e8d5c0;
      border-radius: 10px;
      padding: 10px 12px;
      background: #fdf6ee;
      color: #3d2b1f;
    }

    .add-member-input:focus { outline: none; border-color: #e07b39; }

    .add-member-btn {
      padding: 10px 18px;
      background: #e07b39;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .settings-close-btn {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      background: #fdf0e4;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      color: #a0856a;
      cursor: pointer;
    }

    .settings-close-btn:hover { background: #f5e0cc; }
  </style>
</head>
<body>

<header>
  <button class="settings-btn" onclick="openSettings()" title="가족 관리">⚙️</button>
  <div class="dog-emoji">🐾</div>
  <h1>단추 배식 관리</h1>
  <p>비바티즈 · 3.2kg · <span id="memberCount"></span>명</p>
</header>

<div class="date-bar" id="dateBar"></div>

<div class="cards">
  <div class="card" id="card-food">
    <div class="card-header">
      <span class="card-icon">🍖</span>
      <div>
        <div class="card-title">사료</div>
        <div class="card-subtitle">하루 권장 횟수: 2회</div>
      </div>
      <span class="status-badge" id="badge-food">대기중</span>
    </div>
    <div class="log-list" id="log-food"></div>
    <div class="member-buttons" id="btns-food"></div>
  </div>

  <div class="card" id="card-water">
    <div class="card-header">
      <span class="card-icon">💧</span>
      <div>
        <div class="card-title">물</div>
        <div class="card-subtitle">신선한 물 상시 제공</div>
      </div>
      <span class="status-badge" id="badge-water">대기중</span>
    </div>
    <div class="log-list" id="log-water"></div>
    <div class="member-buttons" id="btns-water"></div>
  </div>
</div>

<div class="qr-section">
  <button class="qr-toggle-btn" onclick="toggleQR()">📱 QR코드로 공유하기</button>
  <div class="qr-box" id="qrBox">
    <p>카메라로 찍으면 단추 배식 앱이 열립니다</p>
    <div id="qrcode"></div>
  </div>
</div>

<div class="reset-section">
  <button class="reset-btn" onclick="resetDay()">🔄 오늘 기록 초기화</button>
</div>

<div class="history-section">
  <div class="history-title">📋 오늘 전체 배식 기록</div>
  <div class="history-table">
    <table>
      <thead>
        <tr><th>시간</th><th>구분</th><th>담당</th></tr>
      </thead>
      <tbody id="historyBody"></tbody>
    </table>
  </div>
</div>

<!-- 가족 관리 모달 -->
<div class="settings-overlay" id="settingsOverlay" onclick="closeSettingsOutside(event)">
  <div class="settings-panel">
    <div class="settings-handle"></div>
    <div class="settings-title">👨‍👩‍👧‍👦 가족 관리</div>
    <div id="memberList"></div>
    <div class="add-member-row">
      <input class="add-member-input" id="newMemberInput" placeholder="이름 입력 후 추가" maxlength="6"
             onkeydown="if(event.key==='Enter') addMember()" />
      <button class="add-member-btn" onclick="addMember()">추가</button>
    </div>
    <button class="settings-close-btn" onclick="closeSettings()">완료</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const STORAGE_KEY   = 'danchu_feeding';
  const MEMBERS_KEY   = 'danchu_members';
  const MAX_FOOD      = 2;
  const DEFAULT_MEMBERS = ['경희', '범이', '한이', '강이'];
  const COLORS = [
    { bg: '#e07b39', bd: '#c96b2a' },
    { bg: '#4f8edc', bd: '#3a72b8' },
    { bg: '#5cb87a', bd: '#3e9c5c' },
    { bg: '#a67cc4', bd: '#8c5eaa' },
    { bg: '#e8a030', bd: '#c88020' },
    { bg: '#e05c7a', bd: '#c04060' },
    { bg: '#3bbcb8', bd: '#2a9a96' },
    { bg: '#8b7355', bd: '#6b5535' },
  ];

  // ── 가족 저장소 ───────────────────────────────────────────
  function loadMembers() {
    try {
      const raw = localStorage.getItem(MEMBERS_KEY);
      return raw ? JSON.parse(raw) : [...DEFAULT_MEMBERS];
    } catch { return [...DEFAULT_MEMBERS]; }
  }

  function saveMembers(members) {
    localStorage.setItem(MEMBERS_KEY, JSON.stringify(members));
  }

  // ── 날짜 ────────────────────────────────────────────────
  function todayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function formatDate(d) {
    const days = ['일','월','화','수','목','금','토'];
    return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
  }

  document.getElementById('dateBar').textContent = '📅 ' + formatDate(new Date());

  // ── 배식 데이터 저장소 ────────────────────────────────────
  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const data = raw ? JSON.parse(raw) : {};
      const key = todayKey();
      if (data.date !== key) return { date: key, food: [], water: [] };
      return data;
    } catch { return { date: todayKey(), food: [], water: [] }; }
  }

  function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function timeStr() {
    const d = new Date();
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  // ── 렌더링 ───────────────────────────────────────────────
  function render() {
    const members = loadMembers();
    document.getElementById('memberCount').textContent = members.length;
    const data = loadData();
    renderCard('food',  data, MAX_FOOD,   members);
    renderCard('water', data, Infinity,   members);
    renderHistory(data);
  }

  function renderCard(type, data, maxCount, members) {
    const logs   = data[type];
    const logEl  = document.getElementById('log-' + type);
    const btnsEl = document.getElementById('btns-' + type);
    const badge  = document.getElementById('badge-' + type);

    if (logs.length === 0) {
      logEl.innerHTML = '<div class="empty-msg">아직 배식 기록이 없습니다</div>';
    } else {
      logEl.innerHTML = logs.map((entry, i) =>
        `<div class="log-item">
          <span class="who">${entry.who}</span>
          <span class="when" onclick="editTime('${type}',${i},this)" title="탭하면 시간 수정">${entry.time}</span>
          <button class="delete-btn" onclick="deleteEntry('${type}',${i})">✕</button>
        </div>`
      ).join('');
    }

    const isFull = logs.length >= maxCount;
    badge.textContent = logs.length > 0 ? `${logs.length}회 완료` : '대기중';
    badge.className   = 'status-badge ' + (logs.length > 0 ? 'done' : 'ok');

    const fedNames = new Set(logs.map(l => l.who));
    btnsEl.innerHTML = members.map((name, idx) => {
      const c = COLORS[idx % COLORS.length];
      const disabled = (fedNames.has(name) || isFull) ? 'disabled' : '';
      const label = name + (fedNames.has(name) ? ' ✓' : '');
      return `<button class="member-btn" style="background:${c.bg};border-color:${c.bd}"
                ${disabled} onclick="feed('${type}','${name}')">${label}</button>`;
    }).join('');
  }

  function renderHistory(data) {
    const all = [
      ...data.food.map(e => ({...e, type:'food'})),
      ...data.water.map(e => ({...e, type:'water'})),
    ].sort((a,b) => a.time.localeCompare(b.time));

    const tbody = document.getElementById('historyBody');
    tbody.innerHTML = all.length === 0
      ? '<tr><td colspan="3" style="text-align:center;color:#c9a07a;padding:16px">기록 없음</td></tr>'
      : all.map(e =>
          `<tr>
            <td>${e.time}</td>
            <td><span class="tag ${e.type}">${e.type==='food'?'🍖 사료':'💧 물'}</span></td>
            <td>${e.who}</td>
          </tr>`
        ).join('');
  }

  // ── 배식 액션 ────────────────────────────────────────────
  function feed(type, who) {
    const data = loadData();
    if (data[type].some(l => l.who === who)) {
      alert(`${who}는 이미 오늘 ${type==='food'?'사료':'물'}을 줬어요! 🐾`);
      return;
    }
    if (type === 'food' && data[type].length >= MAX_FOOD) {
      alert(`오늘 사료 배식 횟수(${MAX_FOOD}회)를 초과했어요.`);
      return;
    }
    data[type].push({ who, time: timeStr() });
    saveData(data);
    render();
  }

  function editTime(type, index, el) {
    const data = loadData();
    const current = data[type][index].time;
    const input = document.createElement('input');
    input.type = 'time';
    input.className = 'time-input';
    input.value = current;
    el.replaceWith(input);
    input.focus();
    function save() {
      if (input.value && input.value !== current) {
        data[type][index].time = input.value;
        saveData(data);
      }
      render();
    }
    input.addEventListener('change', save);
    input.addEventListener('blur', save);
  }

  function deleteEntry(type, index) {
    const data = loadData();
    data[type].splice(index, 1);
    saveData(data);
    render();
  }

  function resetDay() {
    if (!confirm('오늘 배식 기록을 모두 초기화할까요?')) return;
    saveData({ date: todayKey(), food: [], water: [] });
    render();
  }

  // ── 가족 관리 ────────────────────────────────────────────
  function openSettings() {
    renderMemberSettings();
    document.getElementById('settingsOverlay').classList.add('open');
  }

  function closeSettings() {
    document.getElementById('settingsOverlay').classList.remove('open');
    render();
  }

  function closeSettingsOutside(e) {
    if (e.target === e.currentTarget) closeSettings();
  }

  function renderMemberSettings() {
    const members = loadMembers();
    document.getElementById('memberList').innerHTML = members.map((name, i) => {
      const c = COLORS[i % COLORS.length];
      return `<div class="member-row">
        <div class="member-color-dot" style="background:${c.bg}"></div>
        <input class="member-name-input" value="${name}"
               onblur="renameMember(${i}, this.value)"
               onkeydown="if(event.key==='Enter') this.blur()" />
        <button class="member-del-btn" onclick="deleteMember(${i})">🗑</button>
      </div>`;
    }).join('');
  }

  function addMember() {
    const input = document.getElementById('newMemberInput');
    const name  = input.value.trim();
    if (!name) return;
    const members = loadMembers();
    if (members.includes(name)) { alert('이미 있는 이름이에요.'); return; }
    members.push(name);
    saveMembers(members);
    input.value = '';
    renderMemberSettings();
  }

  function deleteMember(index) {
    const members = loadMembers();
    if (members.length <= 1) { alert('최소 1명은 있어야 해요.'); return; }
    if (!confirm(`${members[index]}을(를) 삭제할까요?`)) return;
    members.splice(index, 1);
    saveMembers(members);
    renderMemberSettings();
  }

  function renameMember(index, newName) {
    const name = newName.trim();
    if (!name) return;
    const members = loadMembers();
    if (members[index] === name) return;
    members[index] = name;
    saveMembers(members);
    renderMemberSettings();
  }

  // ── QR코드 ───────────────────────────────────────────────
  const APP_URL = 'https://aniastro11-nova.github.io/animation-quiz/';
  let qrGenerated = false;

  function toggleQR() {
    const box = document.getElementById('qrBox');
    box.classList.toggle('open');
    if (box.classList.contains('open') && !qrGenerated) {
      new QRCode(document.getElementById('qrcode'), {
        text: APP_URL, width: 200, height: 200,
        colorDark: '#3d2b1f', colorLight: '#ffffff',
      });
      qrGenerated = true;
    }
  }

  render();

  setInterval(() => {
    if (loadData().date !== todayKey()) render();
  }, 60 * 1000);
</script>
</body>
</html>
